connecting=Подключение...
connection_failed=Не удалось подключиться к серверу подбора игр. Проверьте подключение к интернету и убедитесь, что игра полностью обновлена.
username_error_too_many=ОШИБКА: Ваш регистрационный ключ уже используется другой учётной записью.
user_error_invalid_email=ОШИБКА: Неверный адрес электронной почты.
user_error_no_such_user=ОШИБКА: Пользователь не существует или пароль неверен.
user_error_version_too_old=ОШИБКА: Нужно обновить Tribal Trouble. Обновите игру в Steam или скачайте последнюю версию с https://tribaltrouble.org
username_error_already_exists=ОШИБКА: Пользователь с таким именем уже существует.
username_error_invalid_characters=ОШИБКА: Имя пользователя содержит недопустимые символы.
username_error_too_short=ОШИБКА: Слишком короткое имя пользователя.
username_error_too_long=ОШИБКА: Слишком длинное имя пользователя.
user_error_steam_required=ОШИБКА: Этот сервер требует входа через Steam. Запустите Tribal Trouble через Steam, чтобы подключиться.
