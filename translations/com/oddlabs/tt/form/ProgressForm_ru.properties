tip0=Атака с возвышенности даёт вашим воинам тактическое преимущество
tip1=Запомните выделение, нажав Ctrl + 0-9, и выберите его снова, нажав нужную цифру
tip2=Дважды нажмите цифру группы, чтобы переместить камеру к ней
tip3=Дважды щёлкните по юниту, чтобы выделить всех юнитов этого типа на экране
tip4=Приближайте и отдаляйте камеру колесом мыши или клавишами Page Up и Page Down
tip5=Чем больше юнитов в оружейной, тем быстрее она делает оружие
tip6=При распределении юнитов щёлкайте правой кнопкой по значкам + и -, чтобы менять число сразу на 10
tip7=Чтобы отправить выбранных юнитов в здание, щёлкните по нему правой кнопкой
tip8=Чем больше юнитов в жилище, тем быстрее оно производит новых батраков
tip9=Чем больше юнитов в жилище, тем быстрее оно обучает вождя
tip10=Батраки сносят башни быстрее воинов
tip11=Если отдать юнитам приказ «Атаковать» по земле, они будут нападать на всех встречных врагов
tip12=Нажмите Пробел или 5 на цифровой клавиатуре, чтобы перейти в режим карты
tip13=Наведите указатель мыши на юнита или здание, чтобы узнать его состояние
tip14=Выделенные юниты и здания союзников отмечаются синими кругами
tip15=Двигайте камеру, подводя указатель мыши к краю экрана или нажимая стрелки
tip16=Поворачивайте камеру клавишами 4 и 6 на цифровой клавиатуре или Insert и Delete
tip17=Укажите точку сбора, чтобы юниты собирались там, выходя из здания
tip18=Смотрите вверх и вниз клавишами 2 и 8 на цифровой клавиатуре или Home и End
tip19=Оружие из тропической курицы отскакивает и может поразить сразу нескольких врагов
tip20=В режиме карты ваши юниты и здания подсвечены цветом игрока
tip21=Чтобы быстро перенестись в другую часть острова, перейдите в режим карты и щёлкните по нужному месту
tip22=Удерживайте Shift и щёлкайте по юнитам, чтобы выделить нескольких
tip23=Чтобы выделить нескольких юнитов, обведите их рамкой
tip24=Чтобы быстро строить новые здания, отправьте группу батраков с древесиной функцией «Перевезти»
tip25=Башни отлично подходят для защиты зданий, батраков и узких проходов
tip26=Стройте дополнительные жилища, чтобы быстрее получать новых батраков
tip27=Если построить оружейную рядом с ценными ресурсами, батраки будут добывать их гораздо быстрее
tip28=Чтобы делать оружие одного типа бесконечно, увеличивайте производство, пока не появится знак бесконечности
tip29=Меняйте скорость игры клавишами + и - на цифровой клавиатуре
tip30=Во время игры нажмите Enter, чтобы написать всем игрокам, и Shift + Enter, чтобы написать команде
tip31=Когда мигает красная, зелёная или синяя стрелка, нажмите Tab, чтобы перейти к месту события
tip32=Юнитов, оглушённых Жутким гудком, легче поразить
tip33=Разрушительный рёв наносит больше урона вблизи
tip34=Юнит получает урон от Вонючей похлёбки, пока находится в её парах
tip35=Свои юниты привыкли к Вонючей похлёбке, поэтому она вредит им меньше
tip36=Трескучей тучей можно бить врагов, засевших в укреплённых лагерях
tip37=Нажмите Ctrl + B и щёлкните по земле, чтобы поставить маяк и предупредить команду
tip38=Нажимайте N, чтобы перебирать свободных батраков
