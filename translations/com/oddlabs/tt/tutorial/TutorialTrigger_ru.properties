army_menu=Вернитесь в главное меню оружейной, нажав значок «Назад» (или Esc). Чтобы вооружить армию только что сделанным оружием, нажмите значок «Вывести армию» (или A).
army=Для каждого вида оружия можно обучить свой вид воинов. Маленькими значками + и - задайте, сколько воинов вам нужно. Попробуйте собрать армию из {0} каменных воинов.
attack_tower=Вашу башню атакует небольшой отряд викингов. Воин в башне сам атакует всех врагов в пределах досягаемости, так что откиньтесь на спинку и наслаждайтесь избиением викингов.
building_chieftain=Постройте жилище и отправьте туда батраков. Чем больше юнитов в жилище, тем быстрее обучится вождь. Выберите жилище и нажмите значок «Обучить вождя» (или C).
build_menu=Вернитесь в главное меню оружейной, нажав значок «Назад» внизу (или Esc). Чтобы сделать оружие, выберите несколько батраков, отправьте их в оружейную и нажмите значок «Делать оружие» под значком «Добывать ресурсы» (или W).
chieftain_built=Учтите: пока вождь обучается, жилище не производит новых юнитов. Обучение можно прервать, снова нажав значок «Обучить вождя» (или C). Повторное нажатие начнёт обучение нового вождя с нуля.
empty_tower=Если воин нужен в другом месте или башня вот-вот рухнет, его можно вывести из башни. Для этого выберите башню и нажмите значок «Выйти» (или X).
from_map_mode=В режиме карты ваши юниты и здания подсвечены цветом вашего игрока. Щёлкните по карте, чтобы приблизить это место, или нажмите пробел либо 5 на цифровой клавиатуре, чтобы вернуться к прежнему виду.
harvest_menu=Вверху показаны запасы ресурсов, юнитов и оружия в оружейной. Чтобы добыть ресурсы на оружие, нажмите значок «Добывать ресурсы» (или G).
magic=У вождя есть две особые магические атаки, и обеим нужно время на зарядку. Выберите вождя и по очереди опробуйте обе атаки, нажимая их значки (или клавиши S и C), когда они станут доступны.
map_mode=Нажмите пробел или 5 на цифровой клавиатуре, чтобы перейти в режим карты.
move_unit=Перемещайте выбранные юниты значком «Идти» (M) или правым щелчком по карте (Ctrl+щелчок на Mac OS X).
pitch=Наклоняйте камеру вверх и вниз клавишами 2 и 8 на цифровой клавиатуре или Home и End.
placing=Игра начинается с небольшой группы батраков — самых простых юнитов. Батраки строят и чинят здания и добывают ресурсы. Выберите батраков и нажмите значок «Жилище» (или Q).
quarters=Зелёные квадраты отмечают места, где можно строить. Наведите указатель мыши на одно из них и щёлкните, чтобы начать стройку.
rally_point=Можно указать, где будут собираться батраки, выходя из жилища, — для этого есть точка сбора. Выберите жилище, нажмите значок «Точка сбора» (или R) и щёлкните в любом месте острова, чтобы её поставить.
repair=Во время атаки ваша башня слегка пострадала. Состояние здания видно, если навести на него указатель мыши. Чтобы починить здание, выберите нескольких батраков, нажмите значок «Чинить» (или G) и щёлкните по зданию. Почините башню.
rotate=Поворачивайте камеру клавишами 4 и 6 на цифровой клавиатуре или Insert и Delete.
scroll=Перемещайтесь по карте, подводя указатель мыши к краю экрана или нажимая стрелки.
select_armory=Выберите батраков и нажмите значок «Оружейная» (или R), чтобы построить оружейную. Когда стройка закончится, батраки сами зайдут внутрь. Щёлкните по зданию, чтобы выбрать его.
select_quarters=Наведите указатель мыши на стройку, чтобы следить за ходом работ. Клавиши + и - на цифровой клавиатуре меняют скорость игры. Когда здание будет готово, щёлкните по нему, чтобы выбрать. Выбранное здание отмечается ярко-зелёным кругом.
select_unit=Чтобы выбрать юнит, щёлкните по нему. Чтобы выбрать несколько, щёлкайте по ним с зажатым Shift или обведите их рамкой. Двойной щелчок по юниту выбирает всех юнитов того же типа в поле зрения. Выбранные юниты отмечены ярко-зелёным кругом.
supply=Для каждого вида ресурсов можно нажать маленький значок +, чтобы назначить батраков на его добычу. Батраки будут работать, пока вы не выберете их и не дадите другой приказ. Попробуйте добыть {0} древесины и {1} камня.
tutorial_over=Постройте жилище и оружейную, добудьте ресурсы, сделайте оружие и выведите армию. Выберите армию, нажмите значок «Атаковать» (или A), прокрутите карту на другую сторону острова и щёлкните по вражеским соплеменникам и зданиям или рядом с ними. Уничтожьте все вражеские юниты и здания!
unit_count=Главная задача жилища — производить новых батраков. Чем больше батраков внутри, тем быстрее появляются новые. Выберите здание и нажимайте маленький значок +, чтобы выводить батраков из жилища. Выведите наружу не меньше {0} батраков.
unit_in_tower=Воин в башне получает бонус к атаке, и его нельзя убить, пока башня цела. Чтобы посадить воина в башню, выберите его и щёлкните правой кнопкой по башне. Посадите воина в башню.
units_in_quarters=Выберите батраков и отправьте их в жилище: нажмите значок «Идти» (или M) и щёлкните по жилищу либо просто щёлкните по жилищу правой кнопкой (Ctrl+щелчок на Mac OS X).
weapon=Для каждого доступного вида оружия маленькими значками + и - задайте, сколько оружия должны сделать батраки (наведите указатель на значок, чтобы увидеть, какие нужны ресурсы). Чем больше батраков в здании, тем быстрее идёт работа. Попробуйте сделать {0} шт. каменного оружия.
zoom=Приближайте и отдаляйте камеру колесом мыши или клавишами Page Up и Page Down. А ещё можно зажать Z и двигать мышь вверх-вниз.
select_tower=Выберите батраков, нажмите «Башня» (или T) и найдите подходящее место для башни. Когда башня будет построена, выберите её.
fpc=Удерживая F или среднюю кнопку мыши, можно поворачивать камеру движением мыши.
