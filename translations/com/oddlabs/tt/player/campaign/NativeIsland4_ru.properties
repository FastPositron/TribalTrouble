dialog0=Приветствуем, вождь, мы знали, что ты придёшь на помощь! Нам удалось сбежать из тюремного лагеря, но мы уже много дней прячемся здесь без воды и еды... Боюсь, мы совсем без сил и не сможем помочь тебе в бою с викингами.
header1=Вождь Нгумба
dialog1=Не волнуйтесь, мы вас защитим, но есть одна загвоздка: наш корабль налетел на риф и набирает воду, надо его починить. Продержимся немного — и уберёмся с этого острова, а вас заберём с собой.
