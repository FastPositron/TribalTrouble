header=Лумумгумфе
description=Корабль не может пройти через риф с вождём Фьорлейфом и его слегка упитанными парнями на борту. Придётся им пересечь остров пешком, пока старпом проводит корабль через риф.
header0=Вождь Фьорлейф
dialog0=Осторожнее, парни! Остров кишит враждебными туземцами, так что смотрите в оба. Нам нужно добраться до точки сбора на другой стороне острова.
header1=Точка сбора достигнута
dialog1=Вы добрались до точки сбора. Подайте кораблю сигнал, чтобы вас забрали: сыграйте Жуткий гудок на своём луре.
header2=Стейнгрим Черепобой
dialog2=Здравы будьте! Наш корабль разбился о рифы, и мы уже давно тут застряли. Прятались от туземцев в этой долине, так что вы очень кстати! С радостью к вам присоединимся: может, это наш единственный шанс выбраться отсюда.
