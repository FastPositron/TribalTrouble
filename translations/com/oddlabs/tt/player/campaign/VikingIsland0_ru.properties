header0=Петур-батрак
dialog0=Ох ты ж, вот это катастрофа! Мало того, что мы опять перебрали, так нас ещё и накрыло жуткой грозой, которая бушевала несколько дней. Остаётся только гадать, куда нас занесло. Половина команды пропала, а вождь Фьорлейф свалился за борт где-то возле этого острова. Похоже, его держат в плену туземцы... Мы должны его освободить!
header1=Вождь Фьорлейф
dialog1=Отличная работа, парни! Пока я сидел в плену у туземцев, мне удалось перерисовать одну из их карт. Сдаётся мне, на больших островах они прячут какие-то сокровища. Всю нашу добычу мы потеряли во время шторма, и я даже думать боюсь, что с нами сделают жёны, если мы вернёмся из этого похода с пустыми руками. Так что за дело!
game_over=Вождь Фьорлейф погиб. Игра окончена.
