header0=Вождь Нгумба
dialog0=Проклятые викинги не успокоятся, пока не утащат все до единой наши священные статуи. Похоже, теперь они идут сюда!
header1=Вождь Нгумба
dialog1=Свирепые мы или нет, а против такой армии нам не выстоять. Пожалуй, спущусь-ка я к пляжу чёрным ходом и... э-э... организую подкрепление. Держитесь, пока меня нет!
header2=Вождь Нгумба
dialog2=Приветствую, парни! Ваша помощь сейчас очень кстати.
header3=Нуфунгу Не-Такой-Уж-Свирепый
dialog3=Поздно: этот Фьорлейф уже утащил последнюю из наших статуй и уплыл. Даже прихватил с собой несколько тропических кур! Но не всё потеряно: мне только что донесли, что на другом конце острова видели его недалёкого кузена Гуннара.
header4=Вождь Нгумба
dialog4=Тогда не будем терять времени: схватим Гуннара и допросим. Если кто и знает, куда направился Фьорлейф, так это он.
header5=Вождь Гуннар Простофиля
dialog5=Ладно, ладно, я понял, сдаюсь! Оставлю ваши статуи в покое и уплыву домой.
header6=Вождь Нгумба
dialog6=Твой кузен Фьорлейф уже украл последнюю, дурень! И если не хочешь, чтобы мы протащили тебя через этот медный рог, ты расскажешь, где искать Фьорлейфа и наши драгоценные статуи.
header7=Вождь Гуннар Простофиля
dialog7=Ай-ай, только не мой лур! Ладно, я помогу вам нарисовать карту наших островов.
