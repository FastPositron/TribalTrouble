header=Когафутшлум
description=Скрытый остров, где на вершине горы обитает великий бог грома Ксаррр. Если доберёмся до вершины, он может исполнить наше желание.
header0=Вождь Фьорлейф
dialog0=Должно быть, это та самая гора, о которой говорил вождь Мозумба. Нам надо подняться на вершину, но вряд ли туземцы пропустят нас без боя. Может, найдём обходной путь?
header1=Вождь Фьорлейф
dialog1=Наконец-то мы на вершине! Ну и где этот бог грома... Я вижу только маленькую уродливую статую!
header2=Ксаррр Громовержец
dialog2=ЧТО ПРИВЕЛО ТЕБЯ В МОЮ ОБИТЕЛЬ, СМЕРТНЫЙ?
header3=Вождь Фьорлейф
dialog3=Ой, статуя разговаривает! Э-э... О, великий Ксаррр, вождь Мозумба сказал мне, что если мы взберёмся на твою гору, ты, может быть, будешь так любезен и исполнишь наше... э-э...
header4=Ксаррр Громовержец
dialog4=ЖЕЛАНИЕ?
header5=Вождь Фьорлейф
dialog5=*сглатывает* Ага, оно самое!
header6=Ксаррр Громовержец
dialog6=Хорошо, чего же ты желаешь, смертный?
header7=Вождь Фьорлейф
dialog7=Эм... Хочу, чтобы мои враги рассыпались в прах передо мной!
header8=Ксаррр Громовержец
dialog8=Ладно, отныне ты сможешь трубить в свой лур Разрушительный рёв, который сокрушит всё вокруг тебя!
header9=Вождь Фьорлейф
dialog9=Ого, спасибо... наверное.
header10=Ксаррр Громовержец
dialog10=А теперь, с твоего позволения... меня ждут грозы.
header11=Вождь Фьорлейф
dialog11=Хм... это, пожалуй, объясняет ту бешеную грозу, что нас сюда и занесла. Ну да ладно, надо опробовать новый Разрушительный рёв, прежде чем двигаться дальше. Устроим небольшую демонстрацию прямо здесь.
