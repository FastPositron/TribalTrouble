header=Дингьяскаги
description=Гуннар что-то говорил о великом и грозном боге грома, который околачивается на этом острове. Ну, ему и до половины могущества Могучего Ксаррра далеко, но, может, он подсобит с барахлящей Трескучей тучей.
header0=Вождь Нгумба
dialog0=Мы на месте — время для небольшого пикника. Только лучше поторопиться: кажется, викинги тоже сюда идут. И да, не подходите слишком близко к тем башням.
header1=Тор
dialog1=Кто посмел вторгнуться на мой полуостров?!?
header2=Вождь Нгумба
dialog2=Вождь Нгумба и его бесстрашные воины!
header3=Тор
dialog3=Ах ты, наглая мелюзга! Ты об этом пожалеешь!
header4=Вождь Нгумба
dialog4=Ай-я-а-а, Великий Ксаррр, защити нас!
header5=Тор
dialog5=Ксаррр? Ты его знаешь? Это же мой старый приятель по Академии богов. Славный малый!
header6=Вождь Нгумба
dialog6=Э-э, ну да. Он научил меня управлять погодой, чтобы разить врагов яростными молниями. Только в этом холодном климате почему-то ничего не выходит.
header7=Тор
dialog7=Тогда он наверняка научил тебя варить ту восхитительную Вонючую похлёбку, которой угощал в старые добрые времена. Обожаю экзотическую кухню, а жена вечно подаёт одно и то же — скучный свиной фарш и кровяную колбасу. Свари мне похлёбки, и я помогу тебе с твоими молниями!
header8=Вождь Нгумба
dialog8=Без проблем, Тор, будет тебе Вонючая похлёбка!
