header=Вардаскогур
description=Может, это и есть тот секретный остров, о котором говорил Гримхильдур Пузохлёб, когда рассказал, что Фьорлейф уплыл со статуями на запад.
header0=Вождь Нгумба
dialog0=Смерть и понос, и здесь никаких статуй! Зато, похоже, чуть дальше по берегу разбили лагерь наши земляки.
header1=Вождь Готоба
dialog1=Привет тебе, вождь Нгумба! Мы — бывшие рабы, которым удалось сбежать. Остров такой огромный, что мы смогли спрятаться от викингов. Сейчас мы обустраиваем здесь лагерь, чтобы построить корабль и уплыть домой.
header2=Вождь Нгумба
dialog2=А давайте объединимся и выгоним викингов с острова? Когда викинги не мешают, строить корабли наверняка куда проще.
header3=Вождь Готоба
dialog3=Звучит как план... пора намять викингам бока!
header4=Нголонго Быстроног
dialog4=Эй, вождь, мы нашли в руинах любопытную карту. На ней остров, о котором мы не знали, — я уже нанёс его на нашу карту. Может, там и прячется Фьорлейф?
game_over=Все союзники погибли. Игра окончена.
