header=Фуфупого
description=У этого острова замечен корабль одного из наших соперников. Похоже, они тоже прознали о сокровищах туземцев.
header0=Вождь Фьорлейф
dialog0=О нет, этот остров захватил мой заклятый соперник Эгиль Яйцеголовый. Наверняка он тоже охотится за сокровищами туземцев. Ой, кажется, он нас заметил!
header1=Эгиль Яйцеголовый
dialog1=Фьорлейф Вонючие Портки, вот мы и встретились снова!
header2=Вождь Фьорлейф
dialog2=*ворчит* ... Не называй меня полным именем, когда парни слышат!
header3=Эгиль Яйцеголовый
dialog3=Что ж, имею честь сообщить, что эти острова отныне являются собственностью Грабительской конторы Яйцеголового, и ваше присутствие обязывает вас уплачивать лицензионный сбор за грабёж в размере одной бочки золота в день. Вы согласны с этими условиями?
header4=Вождь Фьорлейф
dialog4=Что?!? Но мы же приплыли сюда первыми!
header5=Эгиль Яйцеголовый
dialog5=Очевидно, нет. Полагаю, это значит «нет». Мои воины позаботятся о том, чтобы вас вышвырнули с острова самым грубым и в целом неприятным образом. Всего доброго!
header6=Вождь Фьорлейф
dialog6=Вот гад... это ему с рук не сойдёт!
header7=Петур-батрак
dialog7=Вонючие Портки, значит?
header8=Вождь Фьорлейф
dialog8=Заткнись и дерись!
