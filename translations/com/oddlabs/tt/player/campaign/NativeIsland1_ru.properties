header=Вёллурстрёнд
description=Остров Гуннара. Он сказал, что кое-кого из наших сородичей угнали в рабство, — может, некоторые из них оказались здесь. Если так, их надо немедленно освободить!
header0=Зимфубо Ретивый
dialog0=Смотри, вождь! Гуннар не соврал: они увезли с собой наших сородичей — наверняка чтобы сделать из них рабов. Покажи им свой гнев — обрушь на них Трескучую тучу!
header1=Вождь Нгумба
dialog1=Проклятье! В этом холодном климате ничего не выходит. А может, мы просто слишком далеко от владений Великого Ксаррра. Похоже, придётся действовать по старинке... вперёд!
header2=Вождь Нгумба
dialog2=Вы свободны, ребятки, больше никакой работы на викингов!\n\nНу, чего встали? За работу — постройте мне деревню, чтобы мы собрали огромную армию и разгромили этих викингов!
header3=Лумзумба Лежебока
dialog3=*бубнит* *ворчит*
header4=Вождь Нгумба
dialog4=Что?
header5=Лумзумба Лежебока
dialog5=Э-э, слушаюсь, вождь, сию минуту!
